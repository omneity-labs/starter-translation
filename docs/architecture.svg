<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><title>Tarjamli starter request flow</title><desc>Python or TypeScript sends an authenticated request to Sawalni API. Tarjamli Mini returns a translation. The client checks completeness and identity. Saved responses can also be read offline.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#256f47"/></marker></defs><rect width="1600" height="850" fill="#f7f5ed"/><text x="60" y="80" fill="#183027" font-family="Arial,sans-serif" font-size="47" font-weight="700">Tarjamli starter</text><text x="60" y="125" fill="#256f47" font-family="Arial,sans-serif" font-size="25" font-weight="400">Live request path</text><rect x="430" y="172" width="730" height="335" rx="26" fill="#e8f0e5"/><text x="455" y="205" fill="#256f47" font-family="Arial,sans-serif" font-size="20" font-weight="700">Sawalni API</text><rect x="60" y="230" width="310" height="260" rx="22" fill="#ffffff" stroke="#ccd7cc"/><text x="85" y="278" fill="#183027" font-family="Arial,sans-serif" font-size="27" font-weight="700">Your script</text><text x="85" y="320" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">Python · urllib</text><text x="85" y="351" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">TypeScript · fetch</text><text x="85" y="382" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">SAWALNI_API_KEY</text><text x="85" y="413" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">from the environment</text><rect x="450" y="230" width="320" height="260" rx="22" fill="#ffffff" stroke="#ccd7cc"/><text x="475" y="278" fill="#183027" font-family="Arial,sans-serif" font-size="27" font-weight="700">Translation request</text><text x="475" y="320" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">POST /v1/language/translate</text><text x="475" y="351" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">model · text</text><text x="475" y="382" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">source · target</text><text x="475" y="413" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">instructions (optional)</text><rect x="810" y="230" width="330" height="260" rx="22" fill="#ffffff" stroke="#ccd7cc"/><text x="835" y="278" fill="#183027" font-family="Arial,sans-serif" font-size="27" font-weight="700">Tarjamli Mini</text><text x="835" y="320" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">Translate text</text><text x="835" y="351" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">Convert Darija script</text><text x="835" y="382" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">Follow translation</text><text x="835" y="413" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">instructions</text><rect x="1220" y="230" width="320" height="260" rx="22" fill="#ffffff" stroke="#ccd7cc"/><text x="1245" y="278" fill="#183027" font-family="Arial,sans-serif" font-size="27" font-weight="700">Client checks</text><text x="1245" y="320" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">data.complete is true</text><text x="1245" y="351" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">model and target match</text><text x="1245" y="382" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">translated text is not empty</text><text x="1245" y="413" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">Read data.translated</text><path d="M378 358 H440" fill="none" stroke="#256f47" stroke-width="3" marker-end="url(#arrow)"/><path d="M778 358 H800" fill="none" stroke="#256f47" stroke-width="3" marker-end="url(#arrow)"/><path d="M1148 358 H1210" fill="none" stroke="#256f47" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="550" fill="#53665a" font-family="Arial,sans-serif" font-size="21" font-weight="400">The key stays in the client environment and request header. Keep it out of browser code.</text><text x="60" y="620" fill="#256f47" font-family="Arial,sans-serif" font-size="25" font-weight="400">Saved response path</text><rect x="60" y="650" width="480" height="150" rx="22" fill="#ffffff" stroke="#ccd7cc"/><text x="85" y="698" fill="#183027" font-family="Arial,sans-serif" font-size="27" font-weight="700">Captured requests and outputs</text><text x="85" y="740" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">fixtures/reviewed-examples.json</text><rect x="660" y="650" width="570" height="150" rx="22" fill="#ffffff" stroke="#ccd7cc"/><text x="685" y="698" fill="#183027" font-family="Arial,sans-serif" font-size="27" font-weight="700">Browse or print without an API call</text><text x="685" y="740" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">comparison.html · python/run.py --saved</text><text x="685" y="771" fill="#183027" font-family="Arial,sans-serif" font-size="19" font-weight="400">typescript/run.ts --saved</text><path d="M550 722 H648" fill="none" stroke="#256f47" stroke-width="3" marker-end="url(#arrow)"/><text x="1290" y="731" fill="#53665a" font-family="Arial,sans-serif" font-size="22" font-weight="400">No key needed</text></svg>